<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT Jobs - Sign Up</title>
    <link rel="stylesheet" href="./Styles/SignUp.css">
</head>

<body>

    <!-- DARK MODE TOGGLE -->
    <input type="checkbox" id="darkToggle">

    <div class="page">

        <div class="container">

            <h1>Create Account</h1>

            <!-- DARK MODE -->
            <label for="darkToggle" class="dark-btn">🌙 Dark Mode</label>

            <!-- ROLE -->
            <div class="role">
                <input type="radio" name="role" id="job" checked>
                <label for="job">Job Seeker</label>

                <input type="radio" name="role" id="emp">
                <label for="emp">Employer</label>
            </div>

            <form>

                <label>Full Name</label>
                <input type="text" required>

                <label>Email</label>
                <input type="email" required>

                <label>Password</label>
                <input type="password" required>

                <label>Confirm Password</label>
                <input type="password" required>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" required>
                        I agree to Terms & Conditions
                    </label>
                </div>

                <button type="submit">Sign Up</button>

            </form>

            <p class="login-link">
                Already have an account? <a href="login.html">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
