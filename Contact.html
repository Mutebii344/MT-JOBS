<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT Jobs - Contact Us</title>
    <link rel="stylesheet" href="./Styles/Contact.css">

</head>
<body>

    <header >
        <h1>Contact MT Jobs</h1>
        <p>We’re here to help you find jobs or hire talent</p>
    </header>

    <div class="container">

        <div class="grid">

            <div class="card">
                <h2>Contact Information</h2>
                <p><strong>Email:</strong> support@mtjobs.com</p>
                <p><strong>Phone:</strong> +256 706679469</p>
                <p><strong>Location:</strong> Kampala, Uganda</p>
            </div>

            <div class="card">
                <h2>Send a Message</h2>
                <form>
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name" required>

                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>

                    <label>Subject</label>
                    <select>
                        <option>General Inquiry</option>
                        <option>Job Seeker Support</option>
                        <option>Employer Support</option>
                    </select>

                    <label>Message</label>
                    <textarea rows="5" placeholder="Write your message..." required></textarea>

                    <button type="submit">Send Message</button>
                </form>
            </div>

        </div>

        <iframe 
            src="https://maps.google.com/maps?q=kampala&t=&z=13&ie=UTF8&iwloc=&output=embed"
            height="300"
            class="map">
        </iframe>

    </div>

    <footer>
        <p>&copy; 2026 MT Jobs. All rights reserved.</p>
    </footer>

</body>
</html>
