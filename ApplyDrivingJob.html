<!doctype html>
<html>
	<head>
		<title>Apply for Driving Job</title>
		<link rel="stylesheet" href="./Styles/ApplyDrivingJob.css" />
	</head>
	<body>
		<h1>Apply for Job</h1>

		<h2 id="jobTitle"></h2>

		<form id="applicationForm">
			<label>Full Name</label>
			<input type="text" id="name" required /><br />

			<label>Email</label>
			<input type="email" id="email" required /><br />

			<label>Phone</label>
			<input type="tel" id="phone" required /><br />

			<label>Upload Passport Photo</label>
			<input type="file" id="Passport" required /><br />

			<label>Upload Full Photo</label>
			<input type="file" id="cover" /><br />

			<label>Upload Any Identification Document</label>
			<input type="file" id="application" /><br />

			<label>Upload Driver's License</label>
			<input type="file" id="license" /><br />

			<button type="submit">Submit Application</button>
		</form>

		<script>
			// Get selected job
			let job = JSON.parse(localStorage.getItem('selectedJob'));

			if (job) {
				document.getElementById('jobTitle').innerText = job.title;
			}

			document
				.getElementById('applicationForm')
				.addEventListener('submit', function (e) {
					e.preventDefault();

					// Collect data (optional)
					let application = {
						name: document.getElementById('name').value,
						email: document.getElementById('email').value,
						phone: document.getElementById('phone').value,
						license: document.getElementById('license').files[0]
							? document.getElementById('license').files[0].name
							: 'No file uploaded',
						jobTitle: job.title || 'Unknown Job',
					};

					// Save applications (optional but useful)
					let applications =
						JSON.parse(localStorage.getItem('applications')) || [];
					applications.push(application);
					localStorage.setItem('applications', JSON.stringify(applications));

					// Show success message
					alert('Application submitted successfully!');

					// Reset form
					this.reset();
				});
		</script>
	</body>
</html>
